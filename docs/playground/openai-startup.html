<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenAI / Codex 启动画面预览</title>
    <link rel="stylesheet" href="../../packages/effects/builtin/openai-startup/effect.css?v=6" />
    <style>
      :root {
        --woodfish-background-image: url('/local/openai-dragon/background.png');
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        overflow: hidden;
        min-height: 100vh;
        color: #f5f3ff;
        font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        background: #202127;
      }
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        z-index: -1;
        background: linear-gradient(#202127a6, #202127a6), var(--woodfish-background-image);
        background-position: center;
        background-size: cover;
      }
      main {
        max-width: 800px;
        margin: 15vh auto;
        padding: 32px;
      }
      main h1 {
        font-size: clamp(36px, 6vw, 64px);
        font-weight: 500;
        letter-spacing: -2px;
      }
      main p {
        line-height: 1.8;
      }
      aside {
        position: fixed;
        inset: 18px auto 18px 18px;
        width: 170px;
        padding: 18px;
        border-right: 1px solid #ffffff30;
      }
      @media (min-width: 760px) {
        main {
          margin-left: max(205px, calc((100% - 800px) / 2));
        }
      }
      @media (max-width: 759px) {
        aside {
          display: none;
        }
      }
      .composer {
        margin-top: 70px;
        padding: 24px;
        background: #24252cdd;
        border: 1px solid #ffffff30;
        border-radius: 24px;
      }
      nav {
        position: fixed;
        right: 24px;
        bottom: 12px;
        z-index: 2147483100;
        display: flex;
        gap: 12px;
        opacity: 0.35;
      }
      nav:hover,
      nav:focus-within {
        opacity: 1;
      }
      nav button,
      nav label,
      nav select,
      nav input {
        padding: 6px 10px;
        border: 1px solid #ffffff40;
        background: #24252c;
        color: #fff;
        border-radius: 2px;
        font:
          11px 'Segoe UI',
          sans-serif;
        cursor: pointer;
      }
      #name {
        width: 100px;
      }
      nav {
        max-width: calc(100vw - 24px);
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      #layer {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <aside data-sidebar-navigation-root>
      <strong>Codex</strong>
      <p>新聊天</p>
      <p>项目</p>
    </aside>
    <main data-app-action-timeline-scroll>
      <section data-rail-chat-transcript>
        <p>OPENAI / CODEX</p>
        <h1>让想法，从这里开始。</h1>
      </section>
      <div data-codex-composer-root>
        <div class="composer" data-composer-surface-variant="default">你想一起做些什么？</div>
      </div>
    </main>
    <nav aria-label="预览控制">
      <input id="name" type="text" maxlength="48" value="访客" aria-label="展示名称" />
      <button id="replay" type="button">重播启动画面</button>
      <select id="stage" aria-label="定位预览阶段">
        <option value="">完整播放</option>
        <option value="boot">黑幕标识</option>
        <option value="permission">访问许可</option>
        <option value="identity">身份确认</option>
        <option value="read">读取权限</option>
        <option value="verified">环形核验</option>
        <option value="welcome">欢迎页</option>
        <option value="cinema">角色第二幕</option>
      </select>
      <label
        >换预览图片<input id="picture" type="file" accept="image/jpeg,image/png,image/webp" hidden
      /></label>
    </nav>
    <div id="layer"></div>
    <script>
      const module = { exports: null };
    </script>
    <script src="../../packages/effects/builtin/openai-startup/effect.js"></script>
    <script>
      const layer = document.querySelector('#layer');
      let cleanups = [];
      let instance;
      let pictureUrl;
      let clock = 0;
      let jobs = [];
      let paused = false;
      let lastTick = performance.now();
      // 只在预览里使用可推进的虚拟时钟，生产插件仍使用 ctx.later。
      function advance(to) {
        while (true) {
          jobs.sort((a, b) => a.at - b.at);
          const job = jobs[0];
          if (!job || job.at > to) break;
          jobs.shift();
          clock = job.at;
          job.fn();
        }
        clock = to;
      }
      setInterval(() => {
        const now = performance.now();
        if (!paused) advance(clock + now - lastTick);
        lastTick = now;
      }, 50);
      function replay() {
        instance?.dispose?.();
        cleanups.forEach((fn) => fn());
        cleanups = [];
        jobs = [];
        clock = 0;
        paused = false;
        lastTick = performance.now();
        delete document.documentElement.dataset.woodfishOpenaiStartupSeen;
        instance = module.exports({
          layer,
          params: {
            duration: 26,
            requireInteraction: true,
            displayName: document.querySelector('#name').value,
          },
          simplified: () => matchMedia('(prefers-reduced-motion: reduce)').matches,
          reducedMotion: () => matchMedia('(prefers-reduced-motion: reduce)').matches,
          on(target, type, listener, options) {
            const wrapped = (event) => {
              if (type === 'click' || type === 'keydown') paused = false;
              listener(event);
            };
            target.addEventListener(type, wrapped, options);
            cleanups.push(() => target.removeEventListener(type, wrapped, options));
          },
          later(ms, fn) {
            const job = { at: clock + ms, fn };
            jobs.push(job);
            const cancel = () => {
              jobs = jobs.filter((candidate) => candidate !== job);
            };
            cleanups.push(cancel);
            return cancel;
          },
        });
      }
      document.querySelector('#replay').addEventListener('click', replay);
      document.querySelector('#name').addEventListener('change', replay);
      document.querySelector('#stage').addEventListener('change', (event) => {
        const target = event.target.value;
        replay();
        if (!target) return;
        for (let i = 0; i < 20; i++) {
          const screen = layer.querySelector('[data-woodfish-openai-startup]');
          if (!screen || screen.dataset.stage === target) break;
          if (screen.dataset.stage === 'permission' || screen.dataset.stage === 'identity') {
            layer.querySelector('[data-startup-action]').click();
          } else {
            const next = Math.min(...jobs.map((job) => job.at));
            advance(next);
          }
        }
        paused = true;
      });
      document.querySelector('#picture').addEventListener('change', (event) => {
        const file = event.target.files[0];
        if (!file) return;
        if (pictureUrl) URL.revokeObjectURL(pictureUrl);
        pictureUrl = URL.createObjectURL(file);
        document.documentElement.style.setProperty(
          '--woodfish-background-image',
          `url("${pictureUrl}")`
        );
        replay();
      });
      replay();
    </script>
  </body>
</html>
